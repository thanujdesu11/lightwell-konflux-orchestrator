---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: python-remediated-build
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: python, wheels, fromager, lightwell, konflux, remediated
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: >-
    Build CVE-remediated Python wheels from a lightwell-builds git repository.

    Pipeline flow:
      1. git-clone-oci-ta: Clone pypi.org-<package> from lightwell-builds at the
         specified tag (e.g. ntplib/0.4.0), producing a Trusted Artifact.
      2. source-to-sdist: Run git archive HEAD:source/ | gzip -n to reconstruct
         a deterministic sdist. Pre-place it at sdists-repo/downloads/ and export
         as a Trusted Artifact.
      3. python-fromager-build-wheels: Run fromager bootstrap <package>==<version>. fromager
         detects the pre-placed sdist ("already have") and builds wheels without any
         network sdist download. Push wheels as an OCI artifact.
      4. clamav-scan: Scan the wheels artifact for malware.
      5. attach-build-index: Emit a build-index.json (purl, remediated version,
         vuln IDs from the ADR-0005 Lightwell-Fix commit trailers) and attach it
         to the wheels image as an OCI referrer
         (application/vnd.lightwell.build-index.v1+json) for release-side OSV
         generation. Fails closed if no vuln IDs resolve when REQUIRE_VULN=true.
         SCRATCH / clean builds pass REQUIRE_VULN=false so the step still runs.

    The lightwell-builds repo stores each validated package version as a tagged commit
    with source content in source/ and SLSA provenance in .lightwell/metadata.json.
    The git tree SHA of source/ is the cryptographic anchor for Tekton Chains provenance.

  params:
    - name: PACKAGE
      description: >-
        Canonical Python package name (PEP 503 normalized, hyphens only).
        For example: ntplib, urllib3, pillow.
      type: string

    - name: VERSION
      description: >-
        Package version string to build. For example: 0.4.0, 2.5.0.
      type: string

    - name: FIX_TYPE
      description: >-
        Remediation type controlling commit-distance calculation. Must be
        Backport or Novel.
      type: string
    - name: BUILD_CONFIGS_REPO_URL
      description: Build-config registry URL, supplied by the orchestrator.
      type: string
    - name: BUILD_CONFIGS_REVISION
      description: Build-config Git revision, supplied by the orchestrator.
      type: string

    - name: LIGHTWELL_BUILDS_REPO_URL
      description: >-
        URL of the lightwell-builds git repository for this package.
        For example: https://gitlab.cee.redhat.com/lightwell/lightwell-builds/pypi.org-ntplib
      type: string

    - name: LIGHTWELL_BUILDS_TAG
      description: >-
        Git tag in the lightwell-builds repo identifying this version.
        Format: <canonical-name>/<version>, e.g. ntplib/0.4.0
      type: string

    - name: IMAGE
      description: >-
        Destination OCI image reference for the wheels artifact.
        For example: quay.io/redhat-user-workloads/lightwell-python-tenant/ntplib:0.4.0
      type: string

    - name: ociStorage
      description: >-
        OCI reference used as the store for Trusted Artifacts.
        Typically $(params.IMAGE).src — a distinct tag on the same repo.
      type: string

    - name: ociArtifactExpiresAfter
      description: >-
        Expiration for Trusted Artifact OCI objects. Empty means no expiry.
        Time values: 1h, 2d, 3w.
      type: string
      default: ""

    - name: IMAGE_EXPIRES_AFTER
      description: >-
        Expiration for the wheels OCI artifact. Empty means keep the tag.
        Time values: 1h, 2d, 3w.
      type: string
      default: ""

    - name: WHEEL_SERVER_URL
      description: Wheel server URL for prebuilt wheel lookup during fromager dependency resolution.
      type: string
      default: https://packages.redhat.com/lightwell/python/validated/simple/

    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca

    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: ca-bundle.crt

    - name: REQUIRE_VULN
      description: >-
        Passed through to attach-build-index. "true" fails closed without vuln
        IDs; "false" allows clean / SCRATCH builds (LOCAL SPIKE: taskSpec
        embedded in this pipeline, not the catalog bundle).
      type: string
      default: "true"

  workspaces:
    - name: git-auth
      description: >-
        Basic-auth credentials for cloning the lightwell-builds git repository.
        Bound to a secret by the PipelineRun.
      optional: false

  results:
    - name: IMAGE_URL
      description: OCI artifact repository and tag where the wheels were pushed.
      value: $(tasks.fromager-build-wheels.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      description: Digest of the wheels OCI artifact.
      value: $(tasks.fromager-build-wheels.results.IMAGE_DIGEST)
    - name: IMAGE_REF
      description: Full OCI reference (repo@digest) of the wheels artifact.
      value: $(tasks.fromager-build-wheels.results.IMAGE_REF)
    - name: CHAINS-GIT_URL
      description: >-
        URL of the lightwell-builds git repository that was cloned. Required by
        the Konflux Integration Service to create a Snapshot from this build.
      value: $(tasks.clone-lightwell-builds.results.url)
    - name: CHAINS-GIT_COMMIT
      description: >-
        Commit SHA that was checked out. Required by the Konflux Integration
        Service to create a Snapshot from this build.
      value: $(tasks.clone-lightwell-builds.results.commit)

  tasks:
    # ── Step 1: Clone lightwell-builds repo at the specified tag ──────────────
    - name: clone-lightwell-builds
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:d30f13dd15daf89dd6dc645243b3444d35570d13f7840c3fd65e366022515205
          - name: name
            value: git-clone-oci-ta
          - name: kind
            value: task
      params:
        - name: url
          value: $(params.LIGHTWELL_BUILDS_REPO_URL)
        - name: revision
          value: $(params.LIGHTWELL_BUILDS_TAG)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: depth
          value: "0"
        - name: fetchTags
          value: "true"
      workspaces:
        - name: basic-auth
          workspace: git-auth

    # ── Step 2: git archive source/ → pre-placed sdist → Trusted Artifact ────
    - name: source-to-sdist
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-source-to-sdist:0.1@sha256:d9ffa5ea239dea59431d46d72027aa021d01b3666d270bdc464af30d272ca54d
          - name: name
            value: source-to-sdist
          - name: kind
            value: task
      runAfter:
        - clone-lightwell-builds
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-lightwell-builds.results.SOURCE_ARTIFACT)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: FIX_TYPE
          value: $(params.FIX_TYPE)
        - name: BUILD_CONFIGS_REPO_URL
          value: $(params.BUILD_CONFIGS_REPO_URL)
        - name: BUILD_CONFIGS_REVISION
          value: $(params.BUILD_CONFIGS_REVISION)
        - name: LIGHTWELL_BUILDS_TAG
          value: $(params.LIGHTWELL_BUILDS_TAG)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
      workspaces:
        - name: git-auth
          workspace: git-auth

    # ── Step 3: fromager bootstrap from pre-placed sdist → wheels OCI artifact ─
    - name: fromager-build-wheels
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-fromager-build-wheels:0.1@sha256:d91789f1d906fb2028e0aaa05b6f150a03b05ee5a4af9db47c02fab39bcd218b
          - name: name
            value: python-fromager-build-wheels
          - name: kind
            value: task
      runAfter:
        - source-to-sdist
      params:
        - name: SDISTS_ARTIFACT
          value: $(tasks.source-to-sdist.results.SDISTS_ARTIFACT)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(tasks.source-to-sdist.results.COMPUTED_VERSION)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.IMAGE_EXPIRES_AFTER)
        - name: WHEEL_SERVER_URL
          value: $(params.WHEEL_SERVER_URL)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)

    # ── Step 4: ClamAV scan ─
    - name: clamav-scan
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: clamav-scan
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.4@sha256:3203cd3bde82d9e4d1beb5f1366942346800cff89e392c920733eb0ea78d731b
          - name: kind
            value: task
      params:
        - name: image-digest
          value: $(tasks.fromager-build-wheels.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.fromager-build-wheels.results.IMAGE_URL)
      runAfter:
        - fromager-build-wheels

    # ── Step 5: Attach build-index.json OCI referrer for release OSV gen ──────
    # LOCAL SPIKE (KONFLUX-15844): embed patched attach-build-index taskSpec with
    # REQUIRE_VULN (cannot create Tasks in-tenant). Do not push upstream.
    # Source of truth for the patch: tekton/tasks/attach-build-index/0.1/attach-build-index.yaml

    - name: attach-build-index
      runAfter:
      - fromager-build-wheels
      params:
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-lightwell-builds.results.SOURCE_ARTIFACT)
      - name: IMAGE_REF
        value: $(tasks.fromager-build-wheels.results.IMAGE_REF)
      - name: PACKAGE
        value: $(params.PACKAGE)
      - name: VERSION
        value: $(params.VERSION)
      - name: COMPUTED_VERSION
        value: $(tasks.source-to-sdist.results.COMPUTED_VERSION)
      - name: REQUIRE_VULN
        value: $(params.REQUIRE_VULN)
      - name: caTrustConfigMapName
        value: $(params.caTrustConfigMapName)
      - name: caTrustConfigMapKey
        value: $(params.caTrustConfigMapKey)
      taskSpec:
        description: 'Generate a build-index.json for a remediated Python build and attach it to the component
          image as an OCI referrer (media type application/vnd.lightwell.build-index.v1+json), so the release-side
          generate-py-osv task (LWLP-1253) can discover it with `oras discover` and hand it to slan-cuan for
          OSV record generation.

          The primary PURL, the remediated version, and the vulnerability IDs are derived from the ADR-0005
          `Lightwell-Fix:` commit trailers on the checked-out lightwell-builds source (restored from SOURCE_ARTIFACT,
          whose HEAD is the tagged cumulative-patch commit). When REQUIRE_VULN is "true" (default), the task
          fails closed (`--require-vuln`): a remediated build with no resolvable vulnerability IDs is a hard
          error rather than an index that silently ships `vulns: []`. Set REQUIRE_VULN to "false" for clean
          / SCRATCH builds.'
        params:
        - name: REQUIRE_VULN
          description: When "true", pass --require-vuln to fath-cuan (fail if no vuln IDs). When "false",
            allow clean builds with empty vulns (SCRATCH / probe).
          type: string
          default: 'true'
        - name: SOURCE_ARTIFACT
          description: Trusted Artifact URI of the cloned lightwell-builds source tree, as produced by the
            pipeline's git-clone-oci-ta step. Must include the .git directory so the ADR-0005 Lightwell-Fix
            trailers can be read from the HEAD (tagged) commit — the same artifact source-to-sdist consumes
            for its `git archive`, so .git is guaranteed present.
          type: string
        - name: IMAGE_REF
          description: Digest-pinned reference (repo@sha256:...) of the wheels component image the build-index
            referrer is attached to. Digest-pinning guarantees the referrer lands on exactly the image that
            was built.
          type: string
        - name: PACKAGE
          description: Canonical Python package name (PEP 503 normalized, hyphens only), used to construct
            the pkg:pypi PURL.
          type: string
        - name: VERSION
          description: Upstream package version. Recorded as build-index version.upstream and used as the
            PURL/OSV upstream base; must differ from COMPUTED_VERSION.
          type: string
        - name: COMPUTED_VERSION
          description: Full remediated (PEP 440 local) version, e.g. 3.0.1+rhlw.1. Recorded as version.full
            and used as the PURL version, so primaryPurl matches version.full (enforced by the BuildIndex
            schema).
          type: string
        - name: caTrustConfigMapName
          description: The name of the ConfigMap to read CA bundle data from.
          type: string
          default: trusted-ca
        - name: caTrustConfigMapKey
          description: The name of the key in the ConfigMap that contains the CA bundle data.
          type: string
          default: ca-bundle.crt
        results:
        - name: BUILD_INDEX_ATTACHED_REF
          description: The component image reference the build-index referrer was attached to (repo@sha256:...).
            Empty if nothing was attached.
        stepTemplate:
          env:
          - name: IMAGE_REF
            value: $(params.IMAGE_REF)
          volumeMounts:
          - mountPath: /mnt/trusted-ca
            name: trusted-ca
            readOnly: true
        steps:
        - name: use-source-artifact
          image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:9bd32f6bafb517b309e11a2d89365052b4ab3f1c9c23c4ffd45aff6f03960476
          computeResources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
          - mountPath: /var/workdir
            name: workdir
          args:
          - use
          - $(params.SOURCE_ARTIFACT)=/var/workdir/source
        - name: create-and-attach
          image: quay.io/light-factory/fath-cuan@sha256:5b92eb14431ebb3489bc48e57c5ec3ab88397204a0ae1a16261be0b21ca1adce
          computeResources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
          - mountPath: /var/workdir
            name: workdir
          script: |
            #!/bin/bash
            set -euo pipefail

            ca_bundle=/mnt/trusted-ca/ca-bundle.crt
            if [ -f "$ca_bundle" ]; then
              export SSL_CERT_FILE="$ca_bundle"
              export REQUESTS_CA_BUNDLE="$ca_bundle"
            fi

            if [[ "$IMAGE_REF" != *@sha256:* ]]; then
              echo "ERROR: IMAGE_REF must be digest-pinned (contain @sha256:)" >&2
              exit 1
            fi

            SRC=/var/workdir/source
            if [ ! -d "$SRC/.git" ]; then
              echo "ERROR: restored source at $SRC has no .git directory;" >&2
              echo "       cannot read ADR-0005 Lightwell-Fix trailers for --require-vuln" >&2
              exit 1
            fi

            PURL="pkg:pypi/$(params.PACKAGE)@$(params.COMPUTED_VERSION)"
            echo "Generating build-index for ${PURL} (upstream $(params.VERSION))"

            # Extract backport (b) and novel (n) counts from COMPUTED_VERSION (+rhlw.<B>[.n.<N>])
            B=0
            N=0
            if [[ "$(params.COMPUTED_VERSION)" =~ \+rhlw\.([0-9]+)(\.n\.?([0-9]+))? ]]; then
              B="${BASH_REMATCH[1]}"
              [ -n "${BASH_REMATCH[3]:-}" ] && N="${BASH_REMATCH[3]}"
            fi

            # Step 1 — generate build-index.json ONLY (no --attach-to). This is fully
            # offline: fath-cuan reads the ADR-0005 Lightwell-Fix trailers from
            # $SRC/.git and writes the document. It never touches the registry here, so
            # it needs no credentials — all registry auth is confined to the attach below.
            #
            # REQUIRE_VULN=true: fail closed if no vuln IDs resolve from the trailers.
            # REQUIRE_VULN=false: clean / SCRATCH builds may ship vulns: [].
            REQUIRE_VULN_ARGS=()
            if [ "$(params.REQUIRE_VULN)" = "true" ]; then
              REQUIRE_VULN_ARGS+=(--require-vuln)
            fi

            fath-cuan index create \
              --ecosystem pypi \
              --purl "$PURL" \
              --version-upstream "$(params.VERSION)" \
              --version-local "$(params.COMPUTED_VERSION)" \
              --b "$B" \
              --n "$N" \
              --git-dir "$SRC" \
              "${REQUIRE_VULN_ARGS[@]}" \
              --output /var/workdir/build-index.json

            echo "--- build-index.json ---"
            cat /var/workdir/build-index.json
            echo

            # Step 2 — attach build-index.json to IMAGE_REF as an OCI referrer via the
            # oras CLI, NOT fath-cuan's --attach-to. fath-cuan attaches through oras-py
            # 0.2.42 (shipped in this image), which reuses the *pull*-scoped bearer
            # token it obtains while HEAD-resolving the subject for the subsequent
            # referrer blob push; quay then rejects that push with UNAUTHORIZED. The
            # oras CLI requests push scope per-operation and succeeds. This is the same
            # select-oci-auth + `oras --registry-config` pattern that
            # python-fromager-build-wheels uses to push to this very repo.
            #
            # The pipeline SA's quay secrets (imagerepository-*-image-push,
            # components-namespace-pull) carry no `tekton.dev/docker-*` annotation, so
            # creds-init never lands usable quay auth in $HOME/.docker/config.json —
            # hence select-oci-auth to materialize a config.json scoped to IMAGE_REF.
            #
            # artifact-type and the attached file's basename form the downstream
            # contract: generate-py-osv (release-service-catalog) finds this referrer
            # with `oras discover --artifact-type <BUILD_INDEX_MEDIA_TYPE>` and extracts
            # it with `oras pull -o <dir>`, which writes the layer to a file named by
            # its title annotation (the basename oras derives from the arg). It then
            # reads <dir>/build-index.json — so the attached file MUST be build-index.json.
            BUILD_INDEX_MEDIA_TYPE="application/vnd.lightwell.build-index.v1+json"

            select-oci-auth "$IMAGE_REF" > /var/workdir/oci-auth.json
            AUTHFILE="$(realpath /var/workdir/oci-auth.json)"

            cd /var/workdir
            echo "Attaching build-index referrer to ${IMAGE_REF}"
            oras attach "$IMAGE_REF" \
              --registry-config "$AUTHFILE" \
              --artifact-type "$BUILD_INDEX_MEDIA_TYPE" \
              "build-index.json:${BUILD_INDEX_MEDIA_TYPE}"

            echo -n "$IMAGE_REF" | tee "$(results.BUILD_INDEX_ATTACHED_REF.path)"
        volumes:
        - configMap:
            items:
            - key: $(params.caTrustConfigMapKey)
              path: ca-bundle.crt
            name: $(params.caTrustConfigMapName)
            optional: true
          name: trusted-ca
        - emptyDir: {}
          name: workdir
